<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws Panic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="A one-button rooftop hopper. Hold to wind up, release to hop. Land dead centre to build a combo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    gap: 24px; padding: 40px 16px 56px;
    font-family: "Press Start 2P", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* title, tip and how-to: Figma 4655:3900, 4634:3268, 4693:4751 */
  .title {
    margin: 0 0 32px; display: flex; align-items: center; gap: 12px;   /* 32 + body gap 24 = 56px to the game, as on kaiju-roar */
    font: 400 42.581px/normal "Silkscreen", ui-monospace, monospace;
    color: #535353; white-space: nowrap; text-transform: uppercase;
  }
  .title .logo { width: 58.2857px; height: 48px; flex: none; }
  .stage { width: 100%; max-width: 900px; }
  #game {
    display: block; width: 100%; aspect-ratio: 900 / 255; image-rendering: pixelated;
    background: #fff; outline: none; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bar {
    width: 100%; max-width: 900px; min-height: 40px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .tip { margin: 0; font: 400 12.5px/normal "Geist Mono", ui-monospace, monospace; color: #777; }
  .coats { display: flex; gap: 12px; align-items: center; }
  .coats[hidden] { display: none; }
  .coats button { appearance: none; border: 0; background: none; padding: 0 0 6px; cursor: pointer; opacity: .45; position: relative; }
  .coats button.on { opacity: 1; }
  .coats button.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px; background: #535353; }
  .coats canvas { display: block; width: 37.5px; height: 31.5px; image-rendering: pixelated; }
  .howto { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 329px; max-width: 100%; }
  .howto svg { width: 45.2222px; height: 44px; display: block; }
  .howto p { margin: 0; font: 400 13px/normal "Silkscreen", ui-monospace, monospace; color: #535353; text-align: center; text-transform: uppercase; }
  @media (max-width: 640px), (pointer: coarse) {
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  }
  /* sound button: same as mirzawr.com/kaiju-roar */
  .sound {
    flex: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13.5px; color: #535353; background: #f4f4f4; border: 1px solid #ddd; border-radius: 8px;
    padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .sound:hover { background: #ececec; }
  .sound .ico-s { width: 18px; height: 18px; }
  @media (max-width: 640px) {
    .title { margin-bottom: 8px; }   /* 8 + 24 = 32px on phones, as on kaiju-roar */
    #sndLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .sound { gap: 0; }
  }
  @media (max-width: 560px) {
    body { padding-top: 28px; }
    .title { font-size: 30px; gap: 10px; }
    .title .logo { width: 46.63px; height: 38.4px; }
    .tip { display: none; }
    .bar { justify-content: space-between; }   /* cat picker hard left, Sound hard right */
  }
  /* back link: same as kaiju-roar */
  .back{position:fixed;top:40px;left:40px;z-index:10;display:inline-flex;align-items:center;gap:8px;padding:6px 0;
    font-family:'Silkscreen',ui-monospace,monospace;font-size:14px;line-height:1;color:#535353;text-decoration:none}
  .back svg{width:10px;height:10px;flex:none;shape-rendering:crispEdges;transition:transform .2s ease}
  .back:hover svg{transform:translateX(-3px)}
  .back:hover span{text-decoration:underline;text-underline-offset:3px}
  .back:focus-visible{outline:2px solid #535353;outline-offset:4px}
  @media (max-width:640px){
    .back{position:absolute;top:18px;left:18px;font-size:12px}
    body{padding-top:64px !important}
  }
</style>
</head>

  }

  /* ---------- game logic ---------- */
  function startShake(b, dur) {

  }
  function startFall(b) {
    b.state = 'fall'; b.vy = 20; b.shx = 0;

      sfx.chargeStop();
      cat.state = 'fall'; cat.vx = 0; cat.vy = 20; cat.g = 900; cat.spin = b.dir; cat.behind = false; cat.on = null; cat.fallT = 0; cat.gap = null;
      sfx.yowl();
    }
  }
  function land(b) {
    const cx = cat.x, mid = (b.L + b.R) / 2;
    const same = b === cat.on;
    cat.state = 'walk'; cat.y = 0; cat.on = b; cat.squash = 0.5; cat.rot = 0; cat.walk = 0; cat.stepN = 0; cat.bellyV = 110;
    // touched down right at the roof's end: the cat will teeter for a moment before steadying itself
    const toR = b.R - cx, toL = cx - b.L;
    cat.teeterT = Math.min(toR, toL) < 10 ? 1.3 : 0; cat.teeterDir = toR < toL ? 1 : -1;
    sfx.land();
    dust(cx, ROOF_Y, 7, 1);
    if (same) return;
    hops++;
    let gain = 1;
    if (Math.abs(cx - mid) <= 7) {
      chain++; perfects++; bestChain = Math.max(bestChain, chain);
      gain += chain;
      ring(cx, ROOF_Y); sparkle(cx, ROOF_Y, 7);
      floater(cx, ROOF_Y - 62, chain > 1 ? 'PERFECT X' + chain : 'PERFECT', BRICK);
      cat.heartT = 1.1;                                   // little pixel heart pops above the cat
      sfx.perfect(chain);
    } else {
      chain = 0;
      floater(cx, ROOF_Y - 62, '+1', MUTED);
    }

    if (b.fragile) startShake(b, b.dur);
    b.stand = 0;
  }
  function gameOver() {
    if (mode === 'over') return;
    mode = 'over'; overT = 0; cat.state = 'dead';
    sfx.chargeStop();
    sfx.over();
    if (score > hi) { hi = score; newBest = true; store.set(HI_KEY, String(hi)); sfx.best(); }
  }

  function update(dt) {
    time += dt; cloudDrift += dt * 5;

    if (mode === 'over') overT += dt;

    // cat

      if (cat.chargeT > 1.4) cat.chargeT -= 1.4;

      // so a short tap really moves it just a little; it settles once the landing squash is done
      if (cat.squash < 0.2) {

      }
    } else if (cat.state === 'teeter') {

      cat.teeterT -= dt; cat.face = cat.teeterT > 0.35 ? cat.teeterDir : -cat.teeterDir;   // looks over the edge, then turns back
      cat.pebT -= dt;
      if (cat.teeterT > 0.35 && cat.pebT <= 0) {
        cat.pebT = 0.28;
        const ex = cat.teeterDir > 0 ? cat.on.R : cat.on.L;
        particles.push({ kind: 'dust', x: ex, y: ROOF_Y, vx: cat.teeterDir * rand(5, 20), vy: rand(10, 40), life: 0, max: 0.6, r: rand(1, 2) });
      }
      const safe = cat.teeterDir > 0 ? cat.on.R - 9 : cat.on.L + 9;          // a step back inside the roof
      if (cat.teeterT <= 0.35 && Math.abs(safe - cat.x) > 0.5) {

    }
    cat.squash = lerp(cat.squash, 0, 1 - Math.exp(-dt * 11));
    cat.crouch = lerp(cat.crouch || 0, cat.state === 'charge' ? cat.charge : 0, 1 - Math.exp(-dt * 14));
    cat.bellyV += (-300 * cat.belly - 13 * cat.bellyV) * dt; cat.belly += cat.bellyV * dt;
    cat.blink -= dt;
    if (cat.blink <= 0) { cat.blinkT = 0.12; cat.blink = rand(2, 5); }
    if (cat.blinkT > 0) cat.blinkT -= dt;

    // buildings
    for (const b of buildings) {
      if (b.state === 'shake') {
        b.t += dt;
        const k = b.t / b.dur;
        b.shx = Math.sin(time * 70 + b.seed) * (0.8 + k * 2.2);
        if (Math.random() < dt * 14) dust(b.x + rand(0, b.w), ROOF_Y + rand(10, 60), 1, 0.5);
        if (b.t >= b.dur) startFall(b);
      } else if (b.state === 'fall') {
        b.vy += 950 * dt; b.dy += b.vy * dt; b.rot += b.dir * 0.12 * dt;
        if (b.dy > 190) b.state = 'gone';
      }
    }

    // camera follows the roof the cat stands on (kept at the Figma position, 3px from the left)
    if (cat.on && cat.state !== 'fall') {
      camX = lerp(camX, cat.on.x - 3, 1 - Math.exp(-dt * 6));
    }
    while (buildings[buildings.length - 1].x < camX + W + 400) spawnNext();
    while (buildings.length && buildings[0].x + buildings[0].w < camX - 200) buildings.shift();
    updateBirds(dt);

    for (const p of particles) {
      p.life += dt;
      if (p.kind === 'dust') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; }
      else if (p.kind === 'bit') { p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
      else if (p.kind === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
    }

    for (const f of floaters) { f.life += dt; f.y -= 22 * dt; }

  /* ---------- drawing ---------- */
  function rect(col, x, y, w, h) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fill();
  }

        const sx = x - slant * y;

        ctx.fillStyle = TILE_D;                                                       // joint to the next tile
        ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 1.5, y);
        ctx.lineTo(sx + 1.5 - slant * course, y + course); ctx.lineTo(sx - slant * course, y + course); ctx.closePath(); ctx.fill();
      }

    }

    ctx.restore();
  }

  // light frame with a thicker lit side, dark glass split by a cross bar,
  // a small diagonal glint in the top panes and a sill underneath
  const sn = v => Math.round(v / PX) * PX;
  function win(x, y, w, h, lit, narrow) {
    x = sn(x); y = sn(y); w = sn(w); h = sn(h);
    const F = '#808080', G = '#666666', p = PX;
    rect(F, x, y, w, h);                                   // frame
    rect(G, x + p, y + p, w - 2 * p, h - 2 * p);           // glass
    const mx = sn(x + w / 2 - p / 2), my = sn(y + h / 2 - p / 2);

    if (!narrow) rect(F, mx, y + p, p, my - y - p);        // mullion, upper panes only (sash window)
    rect(F, lit < 0 ? x + 2 * p : x + w - 3 * p, y + 2 * p, p, p);   // glint
    rect('#BDBDBD', x - p, y + h, w + 2 * p, p);           // sill
  }

  function drawBuilding(b) {
    if (b.state === 'gone') return;
    const sx = b.x - camX;
    if (sx > W + 20 || sx + b.w < -20) return;
    ctx.save();
    ctx.translate(sn(sx + b.shx), sn(ROOF_Y + b.dy));
    if (b.rot) { ctx.translate(b.w / 2, B_H); ctx.rotate(b.rot); ctx.translate(-b.w / 2, -B_H); }

  }

  // Sitting pose = the Figma vector, cut into body / tail / head so the head can sway

  function tcap(c, ax, ay, ra, bx, by, rb) {      // tapered segment between two circles

    const k = scale, ow = Math.ceil(54 * CS * k), oh = Math.ceil(61 * CS * k);

    o.beginPath(); o.ellipse(15.5, 45, 6, 8, 0.15, 0, 7); o.fill();
    for (const lx of [20.5, 27]) {
      o.beginPath(); o.moveTo(lx - 2.6, 37); o.lineTo(lx + 2.6, 37); o.lineTo(lx + 2.8, 53); o.lineTo(lx - 2.8, 53); o.closePath(); o.fill();

    } else {                                                      // falling: spin and flail
      pitch = cat.rot; air = [1, 1, 1, 1]; tailUp = 0.5;
      const pad = time * 16;
      feet = [[-17 + Math.sin(pad) * 2.5, -6 + Math.cos(pad) * 2],             // hind legs reach back
              [-14 + Math.sin(pad + 2) * 2.5, -4 + Math.cos(pad + 2) * 2],
              [17 + Math.sin(pad + 1) * 2.5, -16 + Math.cos(pad + 1) * 2.5],   // forelegs reach up and out

  const SKYLINE = new Path2D('M0 134.09 L22.59 134.09 L22.59 159.47 L29.13 159.47 L29.13 84.72 L88.77 84.72 L88.77 159.47 L197.36 159.47 L197.36 117.72 L224.49 117.72 L224.49 87.45 L237.13 87.45 L237.13 28.79 L256.48 28.79 L256.48 0 L278.89 0 L278.89 63.86 L303.4 71.07 L303.4 117.72 L361.9 117.72 L361.9 87.45 L416 87.45 L416 117.72 L462.08 117.72 L462.08 40.72 L476.33 40.72 L476.33 16.27 L500 16.27 L500 217.83 L0 217.83 L0 134.09 Z');

    const ph = W < 800, m = ph ? 10 : 15, sz = ph ? 12 : 16, gap = ph ? 18 : 27;
    text('HI ' + pad5(hi), W - m - sz * 5 - gap, m, sz, MUTED, 'right');
    text(pad5(score), W - m, m, sz, flash > 0 ? BRICK : INK, 'right');
    if (chain > 1 && mode === 'play') text('CHAIN X' + chain, W - m, m + sz + 10, 8, BRICK, 'right');

    if (mode === 'ready') {
      const a = 0.55 + 0.45 * Math.sin(time * 3.2);
      ctx.globalAlpha = 0.5 + a * 0.5;
      const nar = W < 800;
      text(nar ? 'HOLD TO WIND UP - RELEASE TO HOP' : 'HOLD SPACE TO WIND UP - RELEASE TO HOP', W / 2, 62, 8, INK, 'center');
      ctx.globalAlpha = 1;
      text(nar ? 'LAND DEAD CENTRE FOR A COMBO' : 'LAND DEAD CENTRE FOR A COMBO. CRACKED ROOFS FALL.', W / 2, 82, 8, MUTED, 'center');
    } else if (mode === 'over') {
      const k = clamp(overT / 0.35, 0, 1);
      ctx.globalAlpha = k * 0.72; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = k;
      text('GAME OVER', W / 2, 72 - Math.round((1 - k) * 3) * 2, 16, INK, 'center', 2);
      text('HOPS ' + hops + '   PERFECT ' + perfects + '   BEST CHAIN ' + bestChain, W / 2, 102, 8, MUTED, 'center');
      if (newBest) text('NEW BEST!', W / 2, 50, 8, BRICK, 'center');
      const da = CAT_ANIM.die;                                  // the cat's little game-over flop
      if (da.img.complete && da.img.naturalWidth) {
        const f = Math.min(da.n - 1, Math.floor(overT * 1000 / da.ms));
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(da.img, f * FS2, 0, FS2, FS2, Math.round((W / 2 - C_PIVOT * PX) / PX) * PX, Math.round((205 - C_FOOT * PX) / PX) * PX, FS2 * PX, FS2 * PX);
      }
      if (overT > 0.7) {
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 3.2);
        text('PRESS SPACE OR TAP TO PLAY AGAIN', W / 2, 128, 8, INK, 'center');
      }
      ctx.globalAlpha = 1;
    }
    camX = realCam;
  }

  /* ---------- loop ---------- */
  let last = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  reset();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('16px "Press Start 2P"')]).catch(() => {});
  }
  requestAnimationFrame(frame);

  // test hook
  window.__paws = { press, release, birds: () => birds, addBird: b => maybeBird(b, true), state: () => ({ mode, score, hops, chain, cat, camX, buildings }) };
